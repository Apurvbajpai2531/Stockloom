apiVersion: v1
kind: ConfigMap
metadata:
  name: stockloom-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stockloom-overview.json: |
    {
      "title": "StockLoom Overview",
      "uid": "stockloom-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Backend Pod Status",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "targets": [
            { "expr": "kube_pod_status_ready{namespace=\"stockloom\", pod=~\"stockloom-backend.*\", condition=\"true\"}" }
          ]
        },
        {
          "type": "stat",
          "title": "Frontend Pod Status",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "targets": [
            { "expr": "kube_pod_status_ready{namespace=\"stockloom\", pod=~\"stockloom-frontend.*\", condition=\"true\"}" }
          ]
        },
        {
          "type": "stat",
          "title": "Postgres Pod Status",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "targets": [
            { "expr": "kube_pod_status_ready{namespace=\"stockloom\", pod=~\"postgres.*\", condition=\"true\"}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pod Restarts (StockLoom)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "kube_pod_container_status_restarts_total{namespace=\"stockloom\"}", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Node Memory Available %",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100" }
          ]
        },
        {
          "type": "logs",
          "title": "Recent StockLoom Logs (all pods)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "datasource": { "type": "loki", "uid": "Loki" },
          "targets": [
            { "expr": "{k8s_namespace_name=\"stockloom\"}" }
          ]
        }
      ]
    }
