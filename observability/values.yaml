cert-manager:
  enabled: true
  installCRDs: true
  startupapicheck:
    enabled: false
  replicaCount: 1
  webhook:
    replicaCount: 1
  cainjector:
    replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

external-secrets:
  enabled: true
  installCRDs: true
  replicaCount: 1
  webhook:
    replicaCount: 1
  certController:
    replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
