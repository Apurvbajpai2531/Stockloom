name: Stockloom CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockloom
          POSTGRES_USER: stockloom
          POSTGRES_PASSWORD: stockloom

        ports:
          - 5434:5432

        options: >-
          --health-cmd "pg_isready -U stockloom -d stockloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout code
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"


      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
  
      - name: Build backend Docker image
        run: |
          docker build -t stockloom-be ./backend


      - name: Check docker image
        run: |
          docker images


      - name: Run backend container
        run: |
          docker run -d \
          --name stockloom-container \
          -p 8000:8000 \
          stockloom-be


      - name: Check running container
        run: |
          docker ps -a


      - name: Check container logs
        run: |
          docker logs stockloom-container



  frontend:

    runs-on: ubuntu-latest

    needs: backend


    steps:

      - name: Checkout code
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"


      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt


      - name: Build frontend Docker image
        run: |
          docker build -t stockloom-fe ./frontend


      - name: Check docker image
        run: |
          docker images


      - name: Run frontend container
        run: |
          docker run -d \
          --name stockloom-fe-container \
          -p 8080:8080 \
          stockloom-fe


      - name: Check running container
        run: |
          docker ps -a


      - name: Check container logs
        run: |
          docker logs stockloom-fe-container