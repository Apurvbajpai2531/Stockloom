name: StockLoom CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockloom
          POSTGRES_USER: stockloom
          POSTGRES_PASSWORD: stockloom
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U stockloom -d stockloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Setup database
        env:
          DATABASE_URL: postgresql+psycopg2://stockloom:stockloom@localhost:5434/stockloom
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: stockloom123
        run: |
          cd backend
          python3 -c "
          import app.models
          from app.core.database import Base, engine, SessionLocal
          from app.core.auth import ensure_default_admin
          Base.metadata.create_all(bind=engine)
          db = SessionLocal()
          ensure_default_admin(db)
          db.close()
          print('DB ready')
          "

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg2://stockloom:stockloom@localhost:5434/stockloom
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key' }}
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: stockloom123
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml 2>/dev/null || echo "No tests yet — skipping"

      - name: Build backend Docker image
        run: |
          docker build -t stockloom/backend:${{ matrix.python-version }} ./backend

      - name: Check Docker image
        run: |
          docker images stockloom/backend:${{ matrix.python-version }} | tee docker-report.txt

      - name: Run backend container (smoke test)
        run: |
          docker run -d \
            --name stockloom-backend-${{ matrix.python-version }} \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg2://stockloom:stockloom@localhost:5434/stockloom \
            -e SECRET_KEY=ci-test-secret-key \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=stockloom123 \
            stockloom/backend:${{ matrix.python-version }}
          sleep 5

      - name: Check running container
        run: docker ps -a

      - name: Check container logs
        run: docker logs stockloom-backend-${{ matrix.python-version }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.python-version }}
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Upload Docker report
        uses: actions/upload-artifact@v4
        with:
          name: docker-report-backend-${{ matrix.python-version }}
          path: docker-report.txt

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r frontend/requirements.txt

      - name: Build frontend Docker image
        run: |
          docker build -t stockloom/frontend:${{ matrix.python-version }} ./frontend

      - name: Check Docker image
        run: |
          docker images stockloom/frontend:${{ matrix.python-version }} | tee docker-fe-report.txt

      - name: Run frontend container
        run: |
          docker run -d \
            --name stockloom-frontend-${{ matrix.python-version }} \
            -p 8081:8081 \
            -e API_BASE_URL=http://stockloom-backend:8000/api \
            stockloom/frontend:${{ matrix.python-version }}
          sleep 5

      - name: Check running container
        run: docker ps -a

      - name: Check container logs
        run: docker logs stockloom-frontend-${{ matrix.python-version }}

      - name: Upload Docker report
        uses: actions/upload-artifact@v4
        with:
          name: docker-report-frontend-${{ matrix.python-version }}
          path: docker-fe-report.txt