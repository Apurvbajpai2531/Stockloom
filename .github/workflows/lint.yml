name: StockLoom Lint

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev


jobs:

  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black


      - name: Run ruff
        run: |
          ruff check backend/app \
            --ignore E501 \
            --exclude backend/venv,backend/prod


      - name: Run black
        run: |
          black --check --diff backend/app \
            --exclude "(venv|prod|__pycache__)"


  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black


      - name: Run ruff
        run: |
          ruff check frontend \
            --ignore E501 \
            --exclude frontend/venv,frontend/prod


      - name: Run black
        run: |
          black --check --diff frontend \
            --exclude "(venv|prod|__pycache__)"


  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install bandit
        run: |
          pip install bandit


      - name: Run bandit
        run: |
          bandit -r backend/app \
            --severity-level medium \
            --confidence-level medium \
            -f txt
        continue-on-error: true


  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install pip-audit
        run: |
          pip install pip-audit


      - name: Audit backend
        run: |
          pip-audit -r backend/requirements.txt
        continue-on-error: true


      - name: Audit frontend
        run: |
          pip-audit -r frontend/requirements.txt
        continue-on-error: true