name: StockLoom Lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff black

      - name: Ruff backend
        run: ruff check backend/app --ignore E501 --ignore E302 --ignore F401
        continue-on-error: true

      - name: Ruff frontend
        run: ruff check frontend --ignore E501 --ignore E302 --ignore F401 --exclude frontend/venv,frontend/prod
        continue-on-error: true

      - name: Black backend
        run: black --check backend/app
        continue-on-error: true

      - name: Black frontend
        run: black --check frontend --exclude "venv|prod|__pycache__"
        continue-on-error: true

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r backend/app -ll
        continue-on-error: true