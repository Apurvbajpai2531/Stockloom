name: Docker Push

on:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        folders: ['backend', 'frontend']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.folders }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stockloom-${{ matrix.folders }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/stockloom-${{ matrix.folders }}:${{ github.sha }}

      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/stockloom-${{ matrix.folders }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        run: cosign sign --yes ${{ secrets.DOCKERHUB_USERNAME }}/stockloom-${{ matrix.folders }}:${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/stockloom-${{ matrix.folders }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.folders }}.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.folders }}
          path: sbom-${{ matrix.folders }}.json

      - name: Attach SBOM attestation to image
        run: cosign attest --yes --predicate sbom-${{ matrix.folders }}.json --type spdxjson ${{ secrets.DOCKERHUB_USERNAME }}/stockloom-${{ matrix.folders }}:${{ github.sha }}
