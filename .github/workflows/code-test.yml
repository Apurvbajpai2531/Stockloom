name: Code Tests

on:
  workflow_call:

jobs:
  test:

    name: Run Application Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: stockloom
          POSTGRES_USER: stockloom
          POSTGRES_PASSWORD: stockloom

        ports:
          - 5434:5432

        options: >-
          --health-cmd "pg_isready -U stockloom -d stockloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov


      - name: Setup Test Database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://stockloom:stockloom@localhost:5434/stockloom
          SECRET_KEY: test-secret-key

        run: |
          python -c "
          from app.core.database import Base, engine
          Base.metadata.create_all(bind=engine)
          print('Database initialized')
          "


      - name: Run Backend Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://stockloom:stockloom@localhost:5434/stockloom
          SECRET_KEY: test-secret-key

        run: |
          pytest tests -v --cov=app --cov-report=xml


      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4

        with:
          name: test-coverage-${{ matrix.python-version }}
          path: backend/coverage.xml