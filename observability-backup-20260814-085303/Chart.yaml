apiVersion: v2
name: stockloom-observability
description: Observability, cert-manager, and external-secrets stack for StockLoom
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: cert-manager
    version: "v1.16.2"
    repository: "https://charts.jetstack.io"
    condition: cert-manager.enabled

  - name: external-secrets
    version: "0.10.5"
    repository: "https://charts.external-secrets.io"
    condition: external-secrets.enabled
