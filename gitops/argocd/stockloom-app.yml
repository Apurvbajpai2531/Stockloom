apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockloom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Apurvbajpai2531/Stockloom
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: stockloom
  syncPolicy:
    automated:
      prune: true
      selfHeal: true    # auto-rollback if drift detected
    syncOptions:
      - CreateNamespace=true
