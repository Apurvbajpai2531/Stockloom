apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: stockloom

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:
      containers:

      - name: postgres

        image: postgres:16

        ports:
        - containerPort: 5434

        env:
        - name: POSTGRES_DB
          value: stockloom

        - name: POSTGRES_USER
          value: stockloom

        - name: POSTGRES_PASSWORD
          value: stockloom


        volumeMounts:

        - name: postgres-data
          mountPath: /var/lib/postgresql/data


  volumeClaimTemplates:

  - metadata:
      name: postgres-data

    spec:

      accessModes:
      - ReadWriteOnce

      storageClassName: manual

      resources:

        requests:
          storage: 500Mi
