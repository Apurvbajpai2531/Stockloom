apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: stockloom-health-check
  namespace: stockloom
spec:
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(http_requests_total{job="stockloom-backend",status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{job="stockloom-backend"}[2m]))
