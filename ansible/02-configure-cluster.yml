---
- name: Configure kubeconfig, clone repo, and baseline cluster resources
  hosts: local
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Update kubeconfig for EKS
      command: >
        aws eks update-kubeconfig
        --region {{ aws_region }}
        --name {{ eks_cluster_name }}

    - name: Clone/update Stockloom repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: main
        force: yes

    - name: Ensure stockloom namespace exists
      command: kubectl get ns {{ k8s_namespace }}
      register: ns_check
      ignore_errors: true

    - name: Create stockloom namespace
      command: kubectl create ns {{ k8s_namespace }}
      when: ns_check is failed

    - name: Check Kyverno CRDs installed
      command: kubectl get crd clusterpolicies.kyverno.io
      register: kyverno_crd_check
      ignore_errors: true

    - name: Install Kyverno (CRDs + controller)
      command: kubectl create -f https://github.com/kyverno/kyverno/releases/download/v1.12.0/install.yaml
      when: kyverno_crd_check is failed

    - name: Wait for Kyverno admission-controller
      command: kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=admission-controller -n kyverno --timeout=180s
      register: kyverno_wait
      ignore_errors: true

    - name: Apply Kyverno policies
      command: kubectl apply -f {{ repo_dest }}/k8s/policies/kyverno-policies.yml

    - name: Apply ArgoCD Application
      command: kubectl apply -f {{ repo_dest }}/k8s/argocd-app.yml
