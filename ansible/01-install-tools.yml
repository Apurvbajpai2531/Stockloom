---
- name: Ensure DevOps CLI tools are present
  hosts: local
  tasks:
    - name: Check argocd CLI installed
      command: which argocd
      register: argocd_check
      ignore_errors: true

    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: '0755'
      when: argocd_check is failed

    - name: Install argocd CLI to ~/.local/bin (no sudo needed)
      get_url:
        url: https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
        dest: "{{ ansible_env.HOME }}/.local/bin/argocd"
        mode: '0755'
      when: argocd_check is failed
