version: "3.8"

services:
  db:
    image: postgres:16
    container_name: stockloom-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockloom-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: stockloom/backend:${APP_VERSION:-latest}
    container_name: stockloom-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockloom-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stockloom/frontend:${APP_VERSION:-latest}
    container_name: stockloom-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://stockloom-backend:8000/api
    ports:
      - "8081:8081"
    networks:
      - stockloom-net

networks:
  stockloom-net:
    driver: bridge

volumes:
  pgdata:
    name: stockloom-pgdata