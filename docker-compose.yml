services:

  db:
    image: postgres:16
    container_name: stockloom-db
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    ports:
      - "5434:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - stockloom-net


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: stockloom/backend:${APP_VERSION:-latest}
    container_name: stockloom-backend
    restart: always

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./backend/.env

    ports:
      - "8002:8000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - stockloom-net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: stockloom/frontend:${APP_VERSION:-latest}
    container_name: stockloom-frontend
    restart: always

    depends_on:
      backend:
        condition: service_healthy
      agentic_ai:
        condition: service_started

    environment:
      API_BASE_URL: http://stockloom-backend:8000/api
      AGENT_BASE_URL: http://stockloom-agentic-ai:8090

    ports:
      - "8081:8081"

    networks:
      - stockloom-net


  agentic_ai:
    build:
      context: ./agentic_ai
      dockerfile: Dockerfile

    image: stockloom/agentic-ai:${APP_VERSION:-latest}
    container_name: stockloom-agentic-ai
    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:0.6b

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8090:8090"

    networks:
      - stockloom-net


networks:
  stockloom-net:
    driver: bridge


volumes:
  pgdata:
    name: stockloom-pgdata